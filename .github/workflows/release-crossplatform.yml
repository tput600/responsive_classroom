name: Build and release desktop packages

on:
  # Temporary, deliberately narrow bootstrap for the approved v3.0.3 release.
  # Later versions require an explicit workflow_dispatch from main.
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'docs/releases/v3.0.3.md'
      - '.github/workflows/release-crossplatform.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New stable tag matching classroom_resources.VERSION (run from main)'
        required: true
        default: 'v3.0.3'
        type: string

permissions:
  contents: read

concurrency:
  group: release-crossplatform
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check release eligibility
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate version, release notes, and unused tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.tag || 'v3.0.3' }}
        run: python source/tools/publish_release.py prepare --tag "$RELEASE_TAG" --event "$RELEASE_EVENT" --output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
            python-architecture: arm64
            machine: arm64
            python: .venv/bin/python
          - runner: macos-15-intel
            target: macos-x86_64
            python-architecture: x64
            machine: x86_64
            python: .venv/bin/python
          - runner: windows-latest
            target: windows-x64
            python-architecture: x64
            machine: AMD64
            python: .venv/Scripts/python.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - name: Verify native interpreter architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: python -c 'import os,platform; actual=platform.machine(); expected=os.environ["EXPECTED_MACHINE"]; assert actual == expected, (actual, expected)'
      - name: Install pinned environment and offline models
        run: python source/tools/setup_environment.py --dev --models
      - name: Check public files, lint, security, and dependencies
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON" source/tools/check_public_tree.py
          "$PYTHON" -m ruff check source --select E9,F63,F7,F82
          "$PYTHON" -m bandit -r source -x source/tests -ll
          "$PYTHON" -m pip_audit -r source/requirements.txt --progress-spinner off
      - name: Run unit tests, package, and verify frozen application
        env:
          PYTHON: ${{ matrix.python }}
        # build_release.py runs the unit suite, PyInstaller, frozen model/UI
        # checks, and archive integrity checks before writing the checksum.
        run: '"$PYTHON" -X utf8 source/tools/build_release.py'
      - name: Save verified release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}
          path: |
            artifacts/ResponsiveClassroom-Portable-${{ matrix.target }}-${{ needs.prepare.outputs.tag }}.zip
            artifacts/ResponsiveClassroom-Portable-${{ matrix.target }}-${{ needs.prepare.outputs.tag }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save build and validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-reports-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish complete verified release
    needs: [prepare, build]
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: responsive_classroom
    # Only this job can create a tag/release or upload release assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Gather this run's three verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # No run-id or external token: download only from this workflow run.
          pattern: release-package-${{ needs.prepare.outputs.tag }}-*
          merge-multiple: true
          path: release-artifacts
      - name: Upload draft, verify remote assets, and publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python source/tools/publish_release.py publish --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --artifacts release-artifacts
