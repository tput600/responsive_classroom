name: Publish unified desktop release

# One deliberate, reviewed bootstrap for this exact already-tested source/run.
# It never runs on main, and checkout executes only the approved source SHA.
on:
  push:
    branches: [codex/publish-v3.1.0]
    paths: ['.github/workflows/publish-unified.yml']

permissions:
  contents: read

concurrency:
  group: publish-unified-v3.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/publish-v3.1.0'
    runs-on: macos-15
    environment: responsive_classroom
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    env:
      APPROVED_RELEASE_COMMIT: 'ac86bd5d21693bb44cef204ac0f02fece28e7f64'
      APPROVED_CANDIDATE_RUN_ID: '37137371666'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 'ac86bd5d21693bb44cef204ac0f02fece28e7f64'
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test offline publication safety checks from approved source
        run: PYTHONPATH=source python -m unittest discover -s source/tests -p 'test_publish_unified_release.py' -v
      - name: Verify pinned native evidence and remote bytes before publishing latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python source/tools/publish_unified_release.py publish \
            --candidate-run-id "$APPROVED_CANDIDATE_RUN_ID" \
            --commit "$APPROVED_RELEASE_COMMIT" \
            --artifacts "$RUNNER_TEMP/unified-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
