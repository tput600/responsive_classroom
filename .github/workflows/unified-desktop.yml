name: Build Windows desktop candidate

# Candidate only: never merges, tags, publishes, or changes existing releases.
on:
  push:
    branches: [codex/unified-desktop-package]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and verify Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - run: python source/tools/setup_environment.py --dev --models
      - run: .venv/Scripts/python.exe -X utf8 source/tools/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ResponsiveClassroom-Windows-v3.1.1
          path: |
            artifacts/ResponsiveClassroom-Portable-windows-x64-v3.1.1.zip
            artifacts/ResponsiveClassroom-Portable-windows-x64-v3.1.1.zip.sha256
            build/reports/integrity.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
