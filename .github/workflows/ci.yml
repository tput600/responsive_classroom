name: Validate responsive_classroom
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned environment
        run: python source/tools/setup_environment.py --dev --models
      - name: Public files and Python checks
        shell: bash
        run: |
          .venv/Scripts/python.exe source/tools/check_public_tree.py
          .venv/Scripts/python.exe -m ruff check source --select E9,F63,F7,F82
          .venv/Scripts/python.exe -m bandit -r source -x source/tests -ll
          .venv/Scripts/python.exe -m pip_audit -r source/requirements.txt --progress-spinner off
      - name: Windows tests
        run: .venv/Scripts/python.exe -X utf8 -m unittest discover -s source/tests -t source -v
