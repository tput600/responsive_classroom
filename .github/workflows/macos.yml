name: Build macOS candidates

# Manual validation only. This workflow does not sign with a Developer ID,
# notarize, create a release, or publish to GitHub Releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.architecture }}
    # Native labels: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python-architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python-architecture: x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - name: Verify native interpreter architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python -c 'import os,platform; actual=platform.machine(); expected=os.environ["EXPECTED_ARCHITECTURE"]; assert actual == expected, (actual, expected)'
      - name: Install pinned environment and offline models
        run: python source/tools/setup_environment.py --dev --models
      - name: Check source
        run: |
          .venv/bin/python source/tools/check_public_tree.py
          .venv/bin/python -m ruff check source --select E9,F63,F7,F82
          .venv/bin/python -m bandit -r source -x source/tests -ll
      - name: Build and verify native app and extracted ZIP
        run: .venv/bin/python -X utf8 source/tools/build_release.py
      - name: Save verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ResponsiveClassroom-macos-${{ matrix.architecture }}
          # Upload the ZIP, not the .app directory: artifact upload flattens permissions.
          path: |
            artifacts/*macos-${{ matrix.architecture }}*.zip
            artifacts/*macos-${{ matrix.architecture }}*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save build and validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.architecture }}-reports
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14
